/* ---------- storage ---------- */
async function load(){const d=A?await A.read('db.json'):localStorage.getItem('chtc_db'),s=A?await A.read('settings.json'):localStorage.getItem('chtc_set');

 const d={...(o.del||{}),...S.db.del};Object.keys(S.db.del).forEach(i=>d[i]=Math.max(S.db.del[i],(o.del||{})[i]||0));

const mark=id=>{(S.db.dirty=S.db.dirty||{})[id]=1},hhmm=()=>new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
let SY,busy=false,again=false;
const sqlText=()=>`-- CHTC Collection Manager: run once in Supabase > SQL Editor
create table if not exists public.specimens (
  id text primary key,
  upd bigint not null default 0,
  deleted boolean not null default false,
${K.map(k=>`  "${k.toLowerCase()}" text not null default ''`).join(',\n')}
);
${K.map(k=>`alter table public.specimens add column if not exists "${k.toLowerCase()}" text not null default '';`).join('\n')}
create index if not exists specimens_upd_idx on public.specimens (upd);
create unique index if not exists specimens_voucher_uq on public.specimens (lower(voucher)) where deleted = false and voucher <> '';
create table if not exists public.profiles (
  id uuid primary key references auth.users(id) on delete cascade,
  email text, name text,
  role text not null default 'pending' check (role in ('pending','viewer','editor','admin'))
);
create or replace function public.my_role() returns text language sql stable security definer set search_path = public as $$ select role from public.profiles where id = auth.uid() $$;
create or replace function public.handle_new_user() returns trigger language plpgsql security definer set search_path = public as $$
begin
  insert into public.profiles (id, email, name, role) values (new.id, new.email, coalesce(new.raw_user_meta_data->>'name', new.email),
    case when not exists (select 1 from public.profiles) then 'admin' else 'pending' end);
  return new;
end $$;
drop trigger if exists on_auth_user_created on auth.users;
create trigger on_auth_user_created after insert on auth.users for each row execute function public.handle_new_user();
insert into public.profiles (id, email, name, role) select id, email, email, 'pending' from auth.users on conflict do nothing;
update public.profiles set role = 'admin' where id = (select id from auth.users order by created_at limit 1) and not exists (select 1 from public.profiles where role = 'admin');
alter table public.specimens enable row level security;
alter table public.profiles enable row level security;
revoke all on public.specimens, public.profiles from anon;
grant select, insert, update, delete on public.specimens, public.profiles to authenticated;
drop policy if exists sp_select on public.specimens;
drop policy if exists sp_insert on public.specimens;
drop policy if exists sp_update on public.specimens;
drop policy if exists sp_delete on public.specimens;
create policy sp_select on public.specimens for select to authenticated using (public.my_role() in ('viewer','editor','admin'));
create policy sp_insert on public.specimens for insert to authenticated with check (public.my_role() = 'admin' or (public.my_role() = 'editor' and not deleted));
create policy sp_update on public.specimens for update to authenticated using (public.my_role() = 'admin' or (public.my_role() = 'editor' and not deleted)) with check (public.my_role() = 'admin' or (public.my_role() = 'editor' and not deleted));
create policy sp_delete on public.specimens for delete to authenticated using (public.my_role() = 'admin');
drop policy if exists pr_select on public.profiles;
drop policy if exists pr_update on public.profiles;
create policy pr_select on public.profiles for select to authenticated using (id = auth.uid() or public.my_role() = 'admin');
create policy pr_update on public.profiles for update to authenticated using (public.my_role() = 'admin') with check (public.my_role() = 'admin');`;
async function rawAuth(path,body){const r=await fetch(S.set.sb.url+path,{method:'POST',headers:{apikey:S.set.sb.key,'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));
 if(!r.ok)throw Object.assign(new Error(d.msg||d.error_description||d.message||d.error||'Request failed'),{status:r.status});return d}
function setSess(d){S.sess={access:d.access_token,refresh:d.refresh_token,exp:Date.now()+(d.expires_in||3600)*1000,email:(d.user&&d.user.email)||(S.sess&&S.sess.email),uid:(d.user&&d.user.id)||(S.sess&&S.sess.uid)};S.set.sess=S.sess;saveSet()}
async function fresh(){if(S.sess&&Date.now()>S.sess.exp-60000){try{setSess(await rawAuth('/auth/v1/token?grant_type=refresh_token',{refresh_token:S.sess.refresh}))}catch(e){if(e.status){S.sess=null;delete S.set.sess;saveSet();S.locked=true;render()}throw e}}}
async function sb(path,o={}){await fresh();const r=await fetch(S.set.sb.url+path,{...o,headers:{apikey:S.set.sb.key,Authorization:'Bearer '+S.sess.access,'Content-Type':'application/json',...o.headers}});const t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch(e){}
 if(!r.ok)throw Object.assign(new Error((d&&(d.message||d.msg||d.error_description))||t||r.statusText),{status:r.status});return d}
async function loadRole(){const p=await sb('/rest/v1/profiles?select=role,name&id=eq.'+S.sess.uid);S.role=(p&&p[0]&&p[0].role)||'pending';S.uname=(p&&p[0]&&p[0].name)||S.sess.email;S.set.role=S.role;S.set.uname=S.uname;saveSet();
 if(S.role=='pending')throw Object.assign(new Error('Your account is waiting for approval by an administrator.'),{pending:1})}
function clearSess(){S.sess=null;delete S.set.sess;delete S.set.role;saveSet()}
async function onlineAuth(signup){const email=$('#oe').value.trim(),pw=$('#op').value,b=$('#ob'),er=$('#oerr');er.textContent='';if(!email||!pw)return er.textContent='Enter your e-mail and password.';b.disabled=true;
 try{let d;if(signup){if(pw.length<8)throw new Error('Password needs at least 8 characters.');d=await rawAuth('/auth/v1/signup',{email,password:pw,data:{name:email}});if(!d.access_token){er.textContent='Account created. Confirm it through the e-mail sent to you, then sign in.';b.disabled=false;return}}
  else d=await rawAuth('/auth/v1/token?grant_type=password',{email,password:pw});
  setSess(d);try{await loadRole()}catch(e){clearSess();throw e}
  S.locked=false;S.page='dash';S.db.dirty=S.db.dirty||{};await syncOnline();clearInterval(SY);SY=setInterval(()=>syncOnline(true),60000);render()}
 catch(e){er.textContent=e instanceof TypeError?'Cannot reach the online database. Check your internet connection.':e.message;b.disabled=false}}
async function resume(){const s=S.set.sess;if(!s)return;S.sess={...s};
 try{await fresh();await loadRole()}catch(e){if(e instanceof TypeError&&S.set.role){S.role=S.set.role;S.uname=S.set.uname}else{S.sess=null;return}}
 S.locked=false;SY=setInterval(()=>syncOnline(true),60000);syncOnline(true)}
async function pull(){const since=S.db.pulled||0;let off=0,mx=since,n=0;
 for(;;){const rows=await sb(`/rest/v1/specimens?select=*&upd=gte.${since}&order=upd.asc,id.asc&limit=1000&offset=${off}`);
  for(const w of rows){const id=w.id,u=+w.upd,loc=R().find(x=>x.id==id);if(u>mx)mx=u;if((loc||S.db.del[id])&&Math.max(loc?loc.upd:0,S.db.del[id]||0)>=u)continue;
   delete S.db.dirty[id];S.db.records=R().filter(x=>x.id!=id);if(w.deleted)S.db.del[id]=u;else{const r={id,upd:u};K.forEach(k=>r[k]=w[k.toLowerCase()]??'');S.db.records.push(r);delete S.db.del[id]}n++}
  if(rows.length<1000)break;off+=1000}
 S.db.pulled=mx;if(n)await saveLocal();return n}
async function push(){const ids=Object.keys(S.db.dirty||{});if(!ids.length)return;if(!can('edit')){S.db.dirty={};return}
 const rec=[],del=[];ids.forEach(id=>{const r=R().find(x=>x.id==id);if(r){const o={id,upd:r.upd,deleted:false};K.forEach(k=>o[k.toLowerCase()]=r[k]||'');rec.push(o)}else if(S.db.del[id])del.push([id,S.db.del[id]]);else delete S.db.dirty[id]});
 const up=a=>sb('/rest/v1/specimens?on_conflict=id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(a)});let bad=0,msg='';
 for(let i=0;i<rec.length;i+=100){const b=rec.slice(i,i+100);try{await up(b);b.forEach(o=>delete S.db.dirty[o.id])}catch(e){if(!e.status)throw e;for(const o of b){try{await up([o]);delete S.db.dirty[o.id]}catch(e2){if(!e2.status)throw e2;bad++;msg=e2.message}}}}
 for(const[id,t]of del){try{await sb('/rest/v1/specimens?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({deleted:true,upd:t})});delete S.db.dirty[id]}catch(e){if(!e.status)throw e;bad++;msg=e.message}}
 await saveLocal();if(bad)toast(`${bad} record(s) could not be saved online: ${msg}`,1)}
async function saveLocal(){const j=await pack();A?await A.write('db.json',j):localStorage.setItem('chtc_db',j)}
async function syncOnline(quiet){if(!S.sess)return;if(busy){again=true;return}busy=true;
 try{await push();const n=await pull();$('#stamp').textContent='Synced online · '+hhmm();if(n&&quiet&&!$('#modal').classList.contains('on')&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))render();else if(n)render()}
 catch(e){if(e instanceof TypeError)$('#stamp').textContent='Offline · changes sync when back online';else toast('Online sync: '+e.message,1)}
 finally{busy=false;if(again){again=false;syncOnline(true)}}}
async function logoutOnline(){await syncOnline();if(Object.keys(S.db.dirty||{}).length&&!confirm('Some changes are not synced online yet and will be lost. Sign out anyway?'))return;
 clearInterval(SY);clearSess();await saveSet();S.db={records:[],del:{},dirty:{},pulled:0};await saveLocal();S.locked=true;S.page='dash';render()}

async function connectSb(){const url=$('#sbu').value.trim().replace(/\/+$/,''),key=$('#sbk').value.trim();if(!/^https:\/\/[^\/\s]+$/.test(url)||key.length<30)return toast('Check the Project URL (https://xxxx.supabase.co) and the anon public key.',1);
 try{const r=await fetch(url+'/auth/v1/settings',{headers:{apikey:key}});if(!r.ok)throw new Error('The server rejected the key (HTTP '+r.status+').')}catch(e){return toast('Could not connect: '+(e instanceof TypeError?'no internet or wrong URL.':e.message),1)}
 S.set.sb={url,key};await saveSet();R().forEach(r=>mark(r.id));S.locked=true;await saveLocal();render();toast('Connected. Sign in or create the first account (it becomes administrator).')}

 t.innerHTML=`<table><tbody>${p.map(x=>`<tr><td>${esc(x.email)}</td><td><select ${x.id==S.sess.uid?'disabled':''} onchange="setProf('${esc(x.id)}',this.value)">${['pending','viewer','editor','admin'].map(r=>`<option ${r==x.role?'selected':''}>${r}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table>`}catch(e){}}

/* ---------- helpers ---------- */
const R=()=>S.db.records,hasGeo=r=>r.lat!==''&&r.lon!==''&&isFinite(+r.lat)&&isFinite(+r.lon);
const hasTissue=v=>{v=String(v||'').trim().toLowerCase();return v!==''&&v!=='none'};
const dparse=v=>/^\d{4}-\d{2}-\d{2}$/.test(v||'')?new Date(v+'T00:00:00'):null,fmtD=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function loanDue(r){const d=dparse(r.loanDate),p=+r.loanPeriod;if(!d||!(p>0))return null;d.setDate(d.getDate()+Math.round(p));return d}
function loanState(r){if(r.loanReturned||!r.loanDate)return null;const due=loanDue(r);if(!due)return{st:'open',due:null,days:null};const t=new Date();t.setHours(0,0,0,0);const days=Math.round((due-t)/864e5);return{st:days<0?'over':days<=7?'soon':'ok',due,days}}
const loans=()=>R().map(r=>[r,loanState(r)]).filter(x=>x[1]);
function loanBanner(){const l=loans().filter(x=>x[1].st=='over'||x[1].st=='soon').sort((a,b)=>a[1].days-b[1].days);if(!l.length)return'';const o=l.filter(x=>x[1].st=='over').length;
 return`<div class="card" style="border-color:${o?'#c33':'var(--a)'};background:${o?'#fdf0ee':'#fff8ea'};margin-bottom:16px"><b>${o?`⚠ ${o} loan${o>1?'s':''} overdue`:'Loans due soon'}${l.length>o?` · ${l.length-o} due within 7 days`:''}</b>${l.slice(0,6).map(([r,s])=>`<div style="margin-top:6px;cursor:pointer" onclick="openEdit('${r.id}')"><b>${esc(r.voucher)}</b> · <em>${esc(sp(r))}</em> · ${esc(r.loanBorrower||'—')}${r.loanInst?', '+esc(r.loanInst):''} · due ${fmtD(s.due)} (${s.days<0?-s.days+' day(s) overdue':s.days==0?'today':'in '+s.days+' day(s)'})</div>`).join('')}${l.length>6?`<div class="sub" style="margin:6px 0 0">+${l.length-6} more (see the Specimens list, filter "Overdue")</div>`:''}</div>`}
const loanPill=r=>{const s=loanState(r);return s?` <span class="pill ${s.st=='over'||s.st=='soon'?'x':''}">${s.st=='over'?'Loan overdue':s.st=='soon'?'Loan due soon':'On loan'}</span>`:''};
function loanNote(){const f=$('#f'),n=$('#ld');if(!f||!n)return;const r={};['loanDate','loanPeriod','loanReturned'].forEach(k=>r[k]=f[k].value.trim());const s=loanState(r),d=loanDue(r);
 n.innerHTML=(r.loanReturned?'Returned on '+esc(r.loanReturned)+'.':d?`Due date: <b>${fmtD(d)}</b>${s.days<0?` · <b style="color:#c33">overdue by ${-s.days} day(s)</b>`:s.days==0?' · due today':` · ${s.days} day(s) left`}.`:'Enter Loan Date and Loan Period to calculate the due date.')+' <span style="color:var(--mut)">Loan data is private and is not included in the Darwin Core export.</span>'}
const yes=v=>/^(y|yes|s|sim|1|true)/i.test(v||'');
const cnt=f=>{const m={};R().forEach(r=>{const v=f(r);if(v)m[v]=(m[v]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])};
const uniq=k=>[...new Set(R().map(r=>r[k]).filter(Boolean))].sort();
const epi=r=>{const g=(r.genus||'').trim(),e=(r.species||'').trim();return g&&e.toLowerCase().startsWith(g.toLowerCase()+' ')?e.slice(g.length+1).trim():e};
const sp=r=>((r.genus||'')+' '+epi(r)).trim();
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),999)}
function pick(cb){const i=$('#fi');i.value='';i.onchange=()=>{const f=i.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>cb(rd.result);rd.readAsText(f)};i.click()}
const today=()=>new Date().toISOString().slice(0,10);

function findByScan(t){t=String(t).trim();const c=[t,t.split(/\r?\n/)[0]];try{const u=new URL(t);['voucher','v','id','catalogNumber'].forEach(k=>u.searchParams.get(k)&&c.push(u.searchParams.get(k)));c.push(decodeURIComponent(u.pathname.split('/').pop()||''))}catch(e){}
 if(t.includes(':'))c.push(t.split(':').pop());const m=t.match(/voucher\s*[:=]\s*(.+)/i);if(m)c.push(m[1].trim());
 for(const x of c){const n=norm(x);if(n){const r=R().find(r=>norm(r.voucher)==n);if(r)return[r,x]}}return[null,c[1]]}
function quick(v,cam){if(!String(v).trim())return;const[r,x]=findByScan(v);if(r){openEdit(r.id);const i=$('#qs');if(i)i.value='';return}

/* ---------- import / export ---------- */
function parseCSV(t){t=t.replace(/^\uFEFF/,'');const h=t.split(/\r?\n/)[0],d=['\t',';',','].map(x=>[x,h.split(x).length]).sort((a,b)=>b[1]-a[1])[0][0],rows=[];let row=[],c='',q=false;
 for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==d){row.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;row.push(c);c='';rows.push(row);row=[]}else c+=ch}
 if(c!==''||row.length){row.push(c);rows.push(row)}return rows.filter(r=>r.some(x=>x.trim()))}
function impCSV(){if(!can('edit'))return toast('Your account is read-only.',1);pick(async t=>{const rows=parseCSV(t);if(rows.length<2)return toast('The file has no data rows.',1);
 const map={};F.forEach(f=>map[norm(f[1])]=f[0]);Object.assign(map,ALIAS);const cols=rows[0].map(h=>map[norm(h)]);
 if(!cols.includes('voucher'))return toast('Column "Voucher Number" not found in the header row.',1);
 let add=0,upd=0,skip=0;rows.slice(1).forEach(row=>{const r={};K.forEach(k=>r[k]='');cols.forEach((k,i)=>{if(k)r[k]=(row[i]||'').trim()});
  if(!r.voucher){skip++;return}const ex=R().find(x=>x.voucher.toLowerCase()==r.voucher.toLowerCase());
  r.id=ex?ex.id:Date.now().toString(36)+Math.random().toString(36).slice(2,7);r.upd=Date.now();
  S.db.records=R().filter(x=>x.id!=r.id).concat(r);mark(r.id);ex?upd++:add++});
 await persist();render();toast(`Imported: ${add} new, ${upd} updated${skip?', '+skip+' skipped (no voucher)':''}`)})}
