name: Build Android APK (optional)
on: workflow_dispatch
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Prepare web files
        run: |
          mkdir www
          cp -r index.html config.js manifest.webmanifest assets www/
          npm install jsqr
          cp node_modules/jsqr/dist/jsQR.js www/jsQR.js
      - name: Create Android project
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "CHTC Collection Manager" br.unifesp.cururulab.chtc --web-dir www
          npx cap add android
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CHTC-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
