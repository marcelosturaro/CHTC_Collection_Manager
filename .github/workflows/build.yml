name: Build installers (Windows, macOS, Linux)
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: CHTC-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
  release:
    # Publishes the installers on the "Releases" page, both for tags (v1.0.0) and for manual runs.
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
        if: github.ref_type == 'tag'
      - id: v2
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
        if: github.ref_type != 'tag'
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - run: ls -R artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag || steps.v2.outputs.tag }}
          name: CHTC Collection Manager ${{ steps.v.outputs.tag || steps.v2.outputs.tag }}
          files: artifacts/*
          make_latest: true
